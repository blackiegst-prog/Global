<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Pro | Premium Edition</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0f111a;
            --card: #1c1f2e;
            --primary: #6366f1;
            --accent: #10b981;
            --danger: #f43f5e;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; } /* Διασφαλίζει ότι τίποτα δεν βγαίνει εκτός */

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 600px; /* Κεντραρισμένο πλάτος */
            margin: 0 auto;
        }

        .header { text-align: center; padding: 20px 0; }
        .header h1 {
            font-size: 1.6rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            width: 100%;
        }

        #reader-container {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #2d324a;
            background: #000;
            width: 100%;
        }
        #reader { width: 100%; min-height: 250px; }

        #success-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(16, 185, 129, 0.2);
            backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            z-index: 10;
        }
        #success-overlay i { font-size: 80px; color: var(--accent); }

        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        
        button {
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        
        .btn-primary { background: var(--primary); color: white; width: 100%; margin-bottom: 12px; }
        .btn-excel { background: rgba(16, 185, 129, 0.1); color: var(--accent); border: 1px solid var(--accent); flex: 1; }
        .btn-print { background: rgba(148, 163, 184, 0.1); color: var(--text-dim); border: 1px solid #334155; flex: 1; }

        /* Search Bar - Πλήρως κεντραρισμένη */
        .search-box {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }
        .search-box i { position: absolute; left: 15px; top: 15px; color: var(--text-dim); }
        .search-box input {
            width: 100%;
            background: #111420;
            border: 1px solid #2d324a;
            padding: 12px 12px 12px 42px;
            border-radius: 12px;
            color: white;
            outline: none;
            font-size: 16px;
        }

        /* Table - Responsive Fix */
        .table-wrapper { width: 100%; overflow-x: hidden; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; table-layout: fixed; }
        
        th { padding: 8px; text-align: left; color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; }
        
        .product-row { background: #252a3d; }
        .product-row td { padding: 12px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* Στήλες Πίνακα */
        .col-info { width: 50%; }
        .col-qty { width: 15%; text-align: center; }
        .col-actions { width: 35%; text-align: right; }

        .qty-badge {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .action-btns { display: flex; gap: 4px; justify-content: flex-end; }
        .btn-icon { width: 32px; height: 32px; padding: 0; background: #334155; border-radius: 6px; font-size: 12px; color: white; }
        .btn-del { color: var(--danger); background: rgba(244, 63, 94, 0.1); }

        @media print {
            .no-print { display: none; }
            body { background: white; color: black; }
            .card { background: white; border: 1px solid #eee; box-shadow: none; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1><i class="fas fa-cube"></i> Inventory Master</h1>
    </div>

    <div class="card no-print">
        <button class="btn-primary" id="startBtn" onclick="initScanner()">
            <i class="fas fa-camera"></i> Άνοιγμα Κάμερας
        </button>
        <div id="reader-container">
            <div id="reader"></div>
            <div id="success-overlay"><i class="fas fa-check-circle"></i></div>
        </div>
        <select id="cam-selection" onchange="changeCamera(this.value)" style="display:none; width:100%; margin-top:10px; background:#252a3d; color:white; border:1px solid #334155; padding:8px; border-radius:8px;"></select>
    </div>

    <div class="btn-group no-print">
        <button class="btn-excel" onclick="exportExcel()"><i class="fas fa-file-excel"></i> Excel</button>
        <button class="btn-print" onclick="window.print()"><i class="fas fa-print"></i> Εκτύπωση</button>
    </div>

    <div class="card">
        <div class="search-box no-print">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Αναζήτηση..." onkeyup="updateUI()">
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="col-info">Προϊόν</th>
                        <th class="col-qty">Ποσ.</th>
                        <th class="col-actions no-print">Πράξεις</th>
                    </tr>
                </thead>
                <tbody id="invBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let inventory = JSON.parse(localStorage.getItem('inv_data')) || [];
    let html5QrCode;
    let isProcessing = false;

    async function initScanner() {
        document.getElementById('startBtn').style.display = 'none';
        try {
            const devices = await Html5Qrcode.getCameras();
            if (devices && devices.length) {
                const select = document.getElementById('cam-selection');
                select.style.display = 'block';
                devices.forEach(device => {
                    const opt = document.createElement('option');
                    opt.value = device.id;
                    opt.text = device.label || `Camera ${select.length + 1}`;
                    select.appendChild(opt);
                });
                const backCam = devices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('rear'));
                startWithId(backCam ? backCam.id : devices[0].id);
            }
        } catch (err) { alert("Σφάλμα κάμερας."); }
    }

    function startWithId(cameraId) {
        if (html5QrCode) { html5QrCode.stop().then(() => startScanner(cameraId)); } 
        else { startScanner(cameraId); }
    }

    function startScanner(cameraId) {
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(cameraId, { fps: 20, qrbox: { width: 250, height: 160 } },
            (text) => {
                if(!isProcessing) {
                    showTick();
                    processBarcode(text);
                    if (navigator.vibrate) navigator.vibrate(80);
                }
            }
        );
    }

    function showTick() {
        isProcessing = true;
        document.getElementById('success-overlay').style.display = 'flex';
        setTimeout(() => { document.getElementById('success-overlay').style.display = 'none'; isProcessing = false; }, 500);
    }

    function processBarcode(code) {
        let idx = inventory.findIndex(i => i.barcode === code);
        if (idx > -1) { inventory[idx].qty++; } 
        else {
            let name = prompt("Όνομα για το " + code + ":");
            if (!name) name = "Προϊόν " + code;
            inventory.push({ barcode: code, name: name, qty: 1 });
        }
        updateUI();
    }

    function updateQty(barcode, delta) {
        let idx = inventory.findIndex(i => i.barcode === barcode);
        inventory[idx].qty += delta;
        if (inventory[idx].qty < 0) inventory[idx].qty = 0;
        updateUI();
    }

    function deleteItem(barcode) {
        if (confirm("Διαγραφή;")) {
            inventory = inventory.filter(i => i.barcode !== barcode);
            updateUI();
        }
    }

    function updateUI() {
        localStorage.setItem('inv_data', JSON.stringify(inventory));
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const body = document.getElementById('invBody');
        const filtered = inventory.filter(i => i.name.toLowerCase().includes(searchTerm) || i.barcode.toLowerCase().includes(searchTerm));

        body.innerHTML = filtered.map(item => `
            <tr class="product-row">
                <td class="col-info">
                    <div style="font-weight:600; color:white; overflow:hidden; text-overflow:ellipsis;">${item.name}</div>
                    <div style="font-size:0.75rem; color:var(--text-dim)">${item.barcode}</div>
                </td>
                <td class="col-qty"><span class="qty-badge">${item.qty}</span></td>
                <td class="col-actions no-print">
                    <div class="action-btns">
                        <button class="btn-icon" onclick="updateQty('${item.barcode}', -1)"><i class="fas fa-minus"></i></button>
                        <button class="btn-icon" onclick="updateQty('${item.barcode}', 1)"><i class="fas fa-plus"></i></button>
                        <button class="btn-icon btn-del" onclick="deleteItem('${item.barcode}')"><i class="fas fa-trash"></i></button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function changeCamera(val) { html5QrCode.stop().then(() => startScanner(val)); }
    function exportExcel() {
        const ws = XLSX.utils.json_to_sheet(inventory);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Stock");
        XLSX.writeFile(wb, "Warehouse_Stock.xlsx");
    }
    window.onload = updateUI;
</script>
</body>
</html>
